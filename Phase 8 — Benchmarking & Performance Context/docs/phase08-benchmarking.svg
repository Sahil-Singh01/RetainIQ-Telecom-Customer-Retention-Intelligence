<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".10"/></filter></defs><rect width="1450" height="560" fill="#f8fafc"/><text x="50" y="58" font-family="Arial" font-size="34" font-weight="700" fill="#172554">RetainRAG — Phase 8 Benchmarking</text><text x="50" y="92" font-family="Arial" font-size="17" fill="#64748b">Add reference points so retention performance can be interpreted in context</text><g filter="url(#s)"><rect x="50" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#93c5fd"/><rect x="70" y="170" width="50" height="30" rx="15" fill="#dbeafe"/><text x="95" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">01</text><text x="72" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Portfolio Benchmark</text><text x="72" y="270" font-family="Arial" font-size="14" fill="#475569">Total churned / total</text><text x="72" y="295" font-family="Arial" font-size="14" fill="#475569">Portfolio churn rate</text><text x="72" y="320" font-family="Arial" font-size="14" fill="#475569">Internal reference point</text><line x1="90" y1="365" x2="290" y2="365" stroke="#e2e8f0"/><text x="72" y="392" font-family="Arial" font-size="12" fill="#64748b">Baseline</text></g><g filter="url(#s)"><rect x="330" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#c4b5fd"/><rect x="350" y="170" width="50" height="30" rx="15" fill="#ede9fe"/><text x="375" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#6d28d9">02</text><text x="352" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Peer-City Benchmark</text><text x="352" y="270" font-family="Arial" font-size="14" fill="#475569">Cities with ≥ 25 customers</text><text x="352" y="295" font-family="Arial" font-size="14" fill="#475569">Median churn rate</text><text x="352" y="320" font-family="Arial" font-size="14" fill="#475569">Comparable peer set</text><line x1="370" y1="365" x2="570" y2="365" stroke="#e2e8f0"/><text x="352" y="392" font-family="Arial" font-size="12" fill="#64748b">Peer context</text></g><g filter="url(#s)"><rect x="610" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#93c5fd"/><rect x="630" y="170" width="50" height="30" rx="15" fill="#dbeafe"/><text x="655" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">03</text><text x="632" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Gap Analysis</text><text x="632" y="270" font-family="Arial" font-size="14" fill="#475569">Observed − benchmark</text><text x="632" y="295" font-family="Arial" font-size="14" fill="#475569">Segment/state/city gaps</text><text x="632" y="320" font-family="Arial" font-size="14" fill="#475569">±1 pp reporting tolerance</text><line x1="650" y1="365" x2="850" y2="365" stroke="#e2e8f0"/><text x="632" y="392" font-family="Arial" font-size="12" fill="#64748b">Performance context</text></g><g filter="url(#s)"><rect x="890" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#c4b5fd"/><rect x="910" y="170" width="50" height="30" rx="15" fill="#ede9fe"/><text x="935" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#6d28d9">04</text><text x="912" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">External Inputs</text><text x="912" y="270" font-family="Arial" font-size="14" fill="#475569">Optional and source-backed</text><text x="912" y="295" font-family="Arial" font-size="14" fill="#475569">Period + population + unit</text><text x="912" y="320" font-family="Arial" font-size="14" fill="#475569">Comparable evidence required</text><line x1="930" y1="365" x2="1130" y2="365" stroke="#e2e8f0"/><text x="912" y="392" font-family="Arial" font-size="12" fill="#64748b">Optional extension</text></g><rect x="50" y="455" width="1350" height="60" rx="18" fill="url(#g)"/><text x="78" y="492" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Benchmark gaps are descriptive comparisons; ±1 percentage point is a reporting convention, not a significance test.</text></svg>