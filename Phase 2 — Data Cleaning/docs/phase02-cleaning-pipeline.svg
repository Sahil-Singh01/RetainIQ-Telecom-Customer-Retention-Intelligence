"270" font-family="Arial" font-size="14" fill="#475569">Trim string whitespace</text><text x="352" y="295" font-family="Arial" font-size="14" fill="#475569">Normalize categorical values</text><text x="352" y="320" font-family="Arial" font-size="14" fill="#475569">Preserve meaningful nulls</text><line x1="370" y1="365" x2="570" y2="365" stroke="#e2e8f0"/><text x="352" y="392" font-family="Arial" font-size="12" fill="#64748b">Transformation</text></g><g filter="url(#s)"><rect x="610" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#93c5fd"/><rect x="630" y="170" width="50" height="30" rx="15" fill="#dbeafe"/><text x="655" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">03</text><text x="632" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Business Flags</text><text x="632" y="270" font-family="Arial" font-size="14" fill="#475569">is_new_customer</text><text x="632" y="295" font-family="Arial" font-size="14" fill="#475569">Joined status mapping</text><text x="632" y="320" font-family="Arial" font-size="14" fill="#475569">Customer-level integrity</text><line x1="650" y1="365" x2="850" y2="365" stroke="#e2e8f0"/><text x="632" y="392" font-family="Arial" font-size="12" fill="#64748b">Derived fields</text></g><g filter="url(#s)"><rect x="890" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#c4b5fd"/><rect x="910" y="170" width="50" height="30" rx="15" fill="#ede9fe"/><text x="935" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#6d28d9">04</text><text x="912" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Validate &amp; Export</text><text x="912" y="270" font-family="Arial" font-size="14" fill="#475569">7,043 × 51 clean data</text><text x="912" y="295" font-family="Arial" font-size="14" fill="#475569">Validation snapshot</text><text x="912" y="320" font-family="Arial" font-size="14" fill="#475569">Raw source never overwritten</text><line x1="930" y1="365" x2="1130" y2="365" stroke="#e2e8f0"/><text x="912" y="392" font-family="Arial" font-size="12" fill="#64748b">Downstream ready</text></g><rect x="50" y="455" width="1350" height="60" rx="18" fill="url(#g)"/><text x="78" y="492" font-family="Arial" font-size="15" font-weight="700" fill="#fff">The validated clean dataset becomes the controlled input for MySQL, modeling, segmentation and RAG.</text></svg>