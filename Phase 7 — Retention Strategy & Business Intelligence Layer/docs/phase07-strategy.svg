<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".10"/></filter></defs><rect width="1450" height="560" fill="#f8fafc"/><text x="50" y="58" font-family="Arial" font-size="34" font-weight="700" fill="#172554">RetainRAG — Phase 7 Retention Strategy</text><text x="50" y="92" font-family="Arial" font-size="17" fill="#64748b">Convert segment and market analysis into prioritized business actions</text><g filter="url(#s)"><rect x="50" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#93c5fd"/><rect x="70" y="170" width="50" height="30" rx="15" fill="#dbeafe"/><text x="95" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">01</text><text x="72" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Revenue at Risk</text><text x="72" y="270" font-family="Arial" font-size="14" fill="#475569">Historical churned-customer exposure</text><text x="72" y="295" font-family="Arial" font-size="14" fill="#475569">Value-aware retention lens</text><text x="72" y="320" font-family="Arial" font-size="14" fill="#475569">Not a forecast</text><line x1="90" y1="365" x2="290" y2="365" stroke="#e2e8f0"/><text x="72" y="392" font-family="Arial" font-size="12" fill="#64748b">Business metric</text></g><g filter="url(#s)"><rect x="330" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#c4b5fd"/><rect x="350" y="170" width="50" height="30" rx="15" fill="#ede9fe"/><text x="375" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#6d28d9">02</text><text x="352" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Priority Score</text><text x="352" y="270" font-family="Arial" font-size="14" fill="#475569">Revenue at Risk × ease</text><text x="352" y="295" font-family="Arial" font-size="14" fill="#475569">Intervention input 1–5</text><text x="352" y="320" font-family="Arial" font-size="14" fill="#475569">Assumption stays explicit</text><line x1="370" y1="365" x2="570" y2="365" stroke="#e2e8f0"/><text x="352" y="392" font-family="Arial" font-size="12" fill="#64748b">Prioritization</text></g><g filter="url(#s)"><rect x="610" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#93c5fd"/><rect x="630" y="170" width="50" height="30" rx="15" fill="#dbeafe"/><text x="655" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">03</text><text x="632" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Action Framework</text><text x="632" y="270" font-family="Arial" font-size="14" fill="#475569">Retention actions by risk</text><text x="632" y="295" font-family="Arial" font-size="14" fill="#475569">Segment and geography context</text><text x="632" y="320" font-family="Arial" font-size="14" fill="#475569">Management-ready outputs</text><line x1="650" y1="365" x2="850" y2="365" stroke="#e2e8f0"/><text x="632" y="392" font-family="Arial" font-size="12" fill="#64748b">Strategy</text></g><g filter="url(#s)"><rect x="890" y="150" width="250" height="275" rx="20" fill="#fff" stroke="#c4b5fd"/><rect x="910" y="170" width="50" height="30" rx="15" fill="#ede9fe"/><text x="935" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#6d28d9">04</text><text x="912" y="238" font-family="Arial" font-size="19" font-weight="700" fill="#172554">Impact Scenarios</text><text x="912" y="270" font-family="Arial" font-size="14" fill="#475569">5% • 10% • 20% • 30%</text><text x="912" y="295" font-family="Arial" font-size="14" fill="#475569">Recovery = risk × rate</text><text x="912" y="320" font-family="Arial" font-size="14" fill="#475569">Scenario assumptions</text><line x1="930" y1="365" x2="1130" y2="365" stroke="#e2e8f0"/><text x="912" y="392" font-family="Arial" font-size="12" fill="#64748b">What-if analysis</text></g><rect x="50" y="455" width="1350" height="60" rx="18" fill="url(#g)"/><text x="78" y="492" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Phase 7 adds a decision-support layer while keeping observed metrics, assumptions and scenarios distinct.</text></svg>