<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1500" height="780" fill="#ffffff"/>
  <text x="60" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#172554">RetainRAG — How a Business Question Is Answered</text>
  <text x="60" y="96" font-family="Arial" font-size="18" fill="#64748b">Comparison-aware routing, evidence validation, grounded generation</text>

  <g filter="url(#s)">
    <rect x="60" y="150" width="250" height="150" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="88" y="186" font-family="Arial" font-size="20" font-weight="700" fill="#1e3a8a">1. Ask</text>
    <text x="88" y="220" font-family="Arial" font-size="15" fill="#475569">“Which segment has</text>
    <text x="88" y="245" font-family="Arial" font-size="15" fill="#475569">the highest revenue</text>
    <text x="88" y="270" font-family="Arial" font-size="15" fill="#475569">at risk?”</text>
  </g>

  <g filter="url(#s)">
    <rect x="365" y="150" width="250" height="150" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="393" y="186" font-family="Arial" font-size="20" font-weight="700" fill="#4338ca">2. Route</text>
    <text x="393" y="220" font-family="Arial" font-size="15" fill="#475569">Detect comparison intent</text>
    <text x="393" y="245" font-family="Arial" font-size="15" fill="#475569">and choose the evidence</text>
    <text x="393" y="270" font-family="Arial" font-size="15" fill="#475569">source.</text>
  </g>

  <g filter="url(#s)">
    <rect x="670" y="125" width="300" height="200" rx="20" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="700" y="162" font-family="Arial" font-size="20" font-weight="700" fill="#172554">3. Retrieve evidence</text>
    <text x="700" y="198" font-family="Arial" font-size="15" fill="#475569">SQL for exact portfolio</text>
    <text x="700" y="223" font-family="Arial" font-size="15" fill="#475569">metrics and comparisons</text>
    <text x="700" y="255" font-family="Arial" font-size="15" fill="#475569">RAG for definitions,</text>
    <text x="700" y="280" font-family="Arial" font-size="15" fill="#475569">methodology, strategy,</text>
    <text x="700" y="305" font-family="Arial" font-size="15" fill="#475569">geography and benchmarks</text>
  </g>

  <g filter="url(#s)">
    <rect x="1025" y="150" width="250" height="150" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1053" y="186" font-family="Arial" font-size="20" font-weight="700" fill="#172554">4. Validate</text>
    <text x="1053" y="220" font-family="Arial" font-size="15" fill="#475569">Check evidence sufficiency</text>
    <text x="1053" y="245" font-family="Arial" font-size="15" fill="#475569">preserve source IDs</text>
    <text x="1053" y="270" font-family="Arial" font-size="15" fill="#475569">avoid unsupported claims</text>
  </g>

  <line x1="310" y1="225" x2="365" y2="225" stroke="url(#b)" stroke-width="5"/>
  <polygon points="365,225 350,216 350,234" fill="#4f46e5"/>
  <line x1="615" y1="225" x2="670" y2="225" stroke="url(#b)" stroke-width="5"/>
  <polygon points="670,225 655,216 655,234" fill="#4f46e5"/>
  <line x1="970" y1="225" x2="1025" y2="225" stroke="url(#b)" stroke-width="5"/>
  <polygon points="1025,225 1010,216 1010,234" fill="#4f46e5"/>

  <g filter="url(#s)">
    <rect x="330" y="410" width="840" height="190" rx="24" fill="#172554"/>
    <text x="365" y="452" font-family="Arial" font-size="21" font-weight="700" fill="#ffffff">5. Generate a grounded answer</text>
    <text x="365" y="488" font-family="Arial" font-size="15" fill="#dbeafe">Ollama + Qwen3 4B receives the user question plus validated evidence.</text>
    <text x="365" y="517" font-family="Arial" font-size="15" fill="#dbeafe">The response is constrained to the available project evidence and context.</text>
    <rect x="365" y="542" width="220" height="34" rx="17" fill="#3b82f6"/>
    <text x="395" y="565" font-family="Arial" font-size="14" font-weight="700" fill="#ffffff">Evidence IDs retained</text>
    <rect x="610" y="542" width="220" height="34" rx="17" fill="#7c3aed"/>
    <text x="641" y="565" font-family="Arial" font-size="14" font-weight="700" fill="#ffffff">Fallback when needed</text>
  </g>

  <line x1="1150" y1="300" x2="1150" y2="410" stroke="#64748b" stroke-width="4"/>
  <polygon points="1150,410 1141,395 1159,395" fill="#64748b"/>

  <g filter="url(#s)">
    <rect x="470" y="650" width="560" height="75" rx="18" fill="#eef2ff" stroke="#c4b5fd"/>
    <text x="500" y="680" font-family="Arial" font-size="16" font-weight="700" fill="#312e81">6. Present in Streamlit</text>
    <text x="500" y="704" font-family="Arial" font-size="14" fill="#475569">Answer + expandable evidence + conversation context</text>
  </g>
</svg>